<!doctype html>
<html lang="th">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>พอร์ตโฟลิโอ ราตรี พิมพ์ศักดิ์</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<style>
/* Layout: navy ceremonial masthead with arched portrait; content on white "paper" with gold hairlines, 7-tab sticky nav, gallery per indicator */
:root{
  --navy:#0B1F3A; --navy-2:#132C50; --ink:#071428;
  --gold:#A8812F; --gold-2:#D4B26A; --gold-soft:#F3E9D2;
  --bg:#F7F8FB; --paper:#FFFFFF; --fg:#14213A; --muted:#5B6782; --line:#E2E5EE;
  --on-navy:#F4F1E8; --on-navy-muted:#B9C3D8;
  --shadow:0 1px 2px rgba(11,31,58,.06),0 8px 28px rgba(11,31,58,.08);
  --f-display:"Noto Serif Thai","Cormorant Garamond",Georgia,serif;
  --f-body:"IBM Plex Sans Thai","Sarabun",system-ui,sans-serif;
  --f-num:"Cormorant Garamond","Noto Serif Thai",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#0A1830; --navy-2:#11264A; --ink:#050E1E;
  --gold:#D6B66A; --gold-2:#E6CB8A; --gold-soft:#2A2A22;
  --bg:#06101F; --paper:#0D1B33; --fg:#E9EDF5; --muted:#9AA6BF; --line:#1E2E4C;
  --on-navy:#F4F1E8; --on-navy-muted:#AAB6CF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#0A1830; --navy-2:#11264A; --ink:#050E1E;
  --gold:#D6B66A; --gold-2:#E6CB8A; --gold-soft:#2A2A22;
  --bg:#06101F; --paper:#0D1B33; --fg:#E9EDF5; --muted:#9AA6BF; --line:#1E2E4C;
  --on-navy:#F4F1E8; --on-navy-muted:#AAB6CF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-variant-numeric:lining-nums}
.stat b{font-variant-numeric:lining-nums tabular-nums!important}
body{margin:0}
img{max-width:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
a{color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.35}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--gold-2);outline-offset:3px;border-radius:4px}

/* Masthead + nav */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--ink);color:var(--on-navy);border-bottom:1px solid rgba(212,178,106,.35)}
.top .wrap{display:flex;align-items:center;gap:18px;min-height:64px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;flex:none}
.seal{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--ink);background:radial-gradient(circle at 35% 30%,#F3DFA6,#C49A45 60%,#8E6A22);box-shadow:0 0 0 2px var(--ink),0 0 0 3px rgba(212,178,106,.7)}
.brand b{display:block;font-family:var(--f-display);font-weight:600;font-size:15px;line-height:1.2}
.brand small{display:block;font-size:11.5px;color:var(--on-navy-muted);letter-spacing:.02em;line-height:1.3}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-left:auto;min-width:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;padding:9px 13px;border-radius:999px;font-size:14px;color:var(--on-navy-muted);white-space:nowrap;transition:color .2s,background .2s}
nav.tabs a:hover{color:var(--on-navy)}
nav.tabs a[aria-current="page"]{color:var(--ink);background:linear-gradient(180deg,#EBD08F,#C9A24E);font-weight:600}
nav.tabs a .n{font-family:var(--f-num);font-size:16px;margin-right:4px}
@media (max-width:860px){.top .wrap{flex-wrap:wrap;gap:6px;padding-block:8px}nav.tabs{margin-left:0;width:100%}.brand small{display:none}}

/* Hero */
.hero{position:relative;background:var(--navy);color:var(--on-navy);overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;opacity:.18;background:
  repeating-radial-gradient(circle at 78% 40%,transparent 0 22px,rgba(212,178,106,.55) 22px 23px),
  linear-gradient(180deg,transparent 60%,var(--ink));pointer-events:none}
.hero .wrap{position:relative;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:48px;align-items:center;padding-block:64px 72px}
.eyebrow{font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-2);display:flex;align-items:center;gap:12px}
.eyebrow::before{content:"";width:36px;height:1px;background:var(--gold-2)}
.hero h1{font-size:clamp(34px,5.2vw,58px);font-weight:600;margin-top:18px;letter-spacing:-.005em}
.hero h1 span{display:block;color:var(--gold-2);font-weight:500;font-size:.5em;margin-top:8px;letter-spacing:.01em}
.hero .role{margin-top:20px;font-size:17px;color:var(--on-navy);max-width:34em}
.hero .role em{font-style:normal;color:var(--on-navy-muted);display:block;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:36px;border-top:1px solid rgba(212,178,106,.35);border-bottom:1px solid rgba(212,178,106,.35)}
.stat{padding:16px 14px;border-left:1px solid rgba(212,178,106,.2)}
.stat:first-child{border-left:0;padding-left:0}
.stat b{display:block;font-family:var(--f-num);font-weight:600;font-size:40px;line-height:1;color:var(--gold-2);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--on-navy-muted);line-height:1.4;display:block;margin-top:6px}
.portrait{justify-self:center;position:relative;width:min(340px,100%)}
.arch{aspect-ratio:3/4;border-radius:999px 999px 14px 14px;overflow:hidden;border:2px solid var(--gold-2);box-shadow:0 0 0 8px rgba(212,178,106,.12),0 30px 60px rgba(0,0,0,.4);background:#fff}
.arch img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
.plate{position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);background:linear-gradient(180deg,#EBD08F,#C49A45);color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:13.5px;padding:7px 18px;border-radius:4px;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.3)}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr;gap:40px;padding-block:40px 56px}.portrait{order:-1;width:min(240px,70%)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat:nth-child(3){border-left:0;padding-left:0}.stat:nth-child(n+3){border-top:1px solid rgba(212,178,106,.2)}}

/* Sections */
main{padding-block:0 80px}
.sec{padding-block:64px 0}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:28px}
.sec-head h2{font-size:clamp(26px,3.2vw,36px);font-weight:600;color:var(--fg)}
.sec-head .kicker{font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:6px}
.sec-head p{margin:0;color:var(--muted);max-width:44em;font-size:15px}

/* Awards */
.honors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.honor{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:zoom-in;display:flex;flex-direction:column;text-align:left;font:inherit;color:inherit;padding:0;transition:transform .25s,box-shadow .25s,border-color .25s}
.honor:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--gold-2)}
.honor .img{aspect-ratio:4/3;background:var(--gold-soft);overflow:hidden;border-bottom:1px solid var(--line)}
.honor .img{display:grid;place-items:center;padding:14px;background:linear-gradient(160deg,var(--gold-soft),var(--paper))}
.honor .img img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .5s;filter:drop-shadow(0 6px 14px rgba(11,31,58,.18))}
.honor:hover .img img{transform:scale(1.03)}
.honor .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.lvl{align-self:flex-start;font-size:11.5px;font-weight:600;letter-spacing:.06em;padding:3px 10px;border-radius:999px;border:1px solid var(--gold);color:var(--gold)}
.lvl.nat{background:linear-gradient(180deg,#EBD08F,#C49A45);color:#0B1F3A;border-color:transparent}
.honor h3{font-size:17px;font-weight:600;line-height:1.45}
.honor .meta{margin-top:auto;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:8px;border-top:1px dashed var(--line)}
.honors .feature{grid-column:span 1}
@media (min-width:980px){.honors .feature:first-child{grid-column:span 2;flex-direction:row}.honors .feature:first-child .img{aspect-ratio:auto;flex:1.2;border-bottom:0;border-right:1px solid var(--line)}.honors .feature:first-child .body{flex:1;padding:28px;justify-content:center}.honors .feature:first-child h3{font-size:24px}}
@media (max-width:860px){.honors{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.honors{grid-template-columns:1fr}}

/* Development */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{font:inherit;font-size:14px;padding:7px 16px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.chip .c{font-family:var(--f-num);font-weight:600;margin-left:6px;color:var(--gold)}
.dv .ov{position:absolute;inset:auto 0 0;display:flex;flex-direction:column;gap:4px;padding:40px 16px 14px;color:#fff;background:linear-gradient(transparent,rgba(7,20,40,.92) 55%);border-radius:0 0 4px 4px}
.dv .ov b{font-weight:500;font-size:14px;line-height:1.45}
.dv.big .ov b{font-family:var(--f-display);font-size:19px;font-weight:600}
.dv .ov small{font-size:12px;color:#C9D2E4}
.dv .tag{position:absolute;top:12px;left:12px;font-size:11.5px;font-weight:600;letter-spacing:.06em;padding:3px 10px;border-radius:999px;background:linear-gradient(180deg,#EBD08F,#C49A45);color:#0B1F3A;z-index:2}
@media (max-width:560px){.dv .ov b{font-size:12.5px}.dv.big .ov b{font-size:15px}.dv:not(.big):not(.wide) .ov small{display:none}}

/* Challenge issues */
.issues{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;counter-reset:i}
.issue{background:var(--paper);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:4px 4px 6px 6px;padding:22px 22px 24px;min-width:0}
.issue .no{font-family:var(--f-num);font-size:44px;line-height:1;color:var(--gold);font-weight:600}
.issue h3{font-size:17.5px;font-weight:600;margin-top:10px;line-height:1.5}
.issue p{margin:10px 0 0;color:var(--muted);font-size:14.5px}
.issue ul{margin:12px 0 0;padding-left:18px;font-size:14px;color:var(--fg)}
.issue li{margin-top:4px}
@media (max-width:860px){.issues{grid-template-columns:1fr}}

/* Domain banner */
.banner{background:var(--navy);color:var(--on-navy);position:relative;overflow:hidden}
.banner::before{content:"";position:absolute;inset:0;opacity:.14;background:repeating-radial-gradient(circle at 92% 50%,transparent 0 18px,rgba(212,178,106,.6) 18px 19px);pointer-events:none}
.banner .wrap{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,420px);gap:32px;align-items:center;padding-block:48px}
@media (max-width:860px){.banner .wrap{grid-template-columns:auto minmax(0,1fr)}.banner .collage{grid-column:1/-1;width:100%;justify-self:center}}
.banner .big{font-family:var(--f-num);font-size:clamp(80px,11vw,150px);line-height:.85;color:var(--gold-2);font-weight:500;font-style:italic}
.banner h1{font-size:clamp(24px,3.4vw,38px);font-weight:600}
.banner p{margin:10px 0 0;color:var(--on-navy-muted);font-size:15px;max-width:46em}
.banner .meta{margin-top:16px;display:flex;gap:18px;flex-wrap:wrap;font-size:14px}
.banner .meta b{font-family:var(--f-num);font-size:22px;color:var(--gold-2);margin-right:6px}
.banner .meta a{color:var(--gold-2);text-underline-offset:3px}
@media (max-width:600px){.banner .wrap{grid-template-columns:1fr;gap:6px}.banner .collage{margin-top:22px}}

/* Indicator index + blocks */
.toc{display:flex;flex-wrap:wrap;gap:8px;padding-block:22px 0}
.toc a{text-decoration:none;font-size:14px;padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--paper)}
.toc a:hover{border-color:var(--gold)}
.toc a b{font-family:var(--f-num);color:var(--gold);margin-right:6px;font-size:16px}
/* Each indicator = its own framed panel: navy header plate + paper body */
.ind{margin-top:56px;scroll-margin-top:120px;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.ind-head{position:relative;overflow:hidden;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:24px;align-items:center;padding:22px 26px;background:var(--navy);color:var(--on-navy);border-radius:10px 10px 0 0;border-bottom:3px solid var(--gold-2)}
.ind-head::after{content:attr(data-code);position:absolute;right:-6px;bottom:-34px;font-family:var(--f-num);font-style:italic;font-size:150px;line-height:1;color:rgba(212,178,106,.10);pointer-events:none}
.code{position:relative;z-index:1;display:grid;place-items:center;min-width:88px;height:88px;padding:0 10px;border-radius:50%;font-family:var(--f-num);font-weight:600;font-size:36px;line-height:1;color:#0B1F3A;background:radial-gradient(circle at 35% 30%,#F6E4B0,#D4B26A 55%,#A8812F);box-shadow:0 0 0 3px var(--navy),0 0 0 4px rgba(235,208,143,.7)}
.ind-head > div:nth-child(2){position:relative;z-index:1}
.ind-head .lbl{font-size:12px;letter-spacing:.16em;color:var(--gold-2);font-weight:600}
.ind-head h2{font-family:var(--f-display);font-size:19px;font-weight:600;line-height:1.55;color:var(--on-navy);margin-top:2px}
.ind-head .count{font-size:13px;color:var(--on-navy-muted);margin-top:6px}
.ind-body{padding:24px 26px 28px}
.ind:nth-of-type(even) .ind-body{background:linear-gradient(180deg,var(--gold-soft),transparent 140px);border-radius:0 0 10px 10px}
.btn{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;text-decoration:none;padding:8px 14px;border-radius:999px;border:1px solid var(--gold);color:var(--gold);white-space:nowrap;background:transparent}
.btn:hover{background:var(--gold);color:var(--paper)}
.btn svg{width:14px;height:14px}
.ind-head .btn{position:relative;z-index:1;border-color:var(--gold-2);color:var(--gold-2)}
.ind-head .btn:hover{background:var(--gold-2);color:#0B1F3A}
@media (max-width:640px){.ind{margin-top:40px}.ind-head{grid-template-columns:auto minmax(0,1fr);gap:16px;padding:18px}.ind-head .btn{grid-column:1/-1;justify-self:start}.code{min-width:64px;height:64px;font-size:26px}.ind-head h2{font-size:16.5px}.ind-body{padding:16px}}
/* Mosaic: mixed-size layered tiles (big 2x2, wide 2x1, tall 1x2, sm 1x1) on a dense 4-col grid */
.mosaic{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:190px;grid-auto-flow:dense;gap:16px;padding:6px 10px 10px 0}
.mosaic.few{grid-template-columns:repeat(var(--n),minmax(0,1fr));grid-auto-rows:300px;max-width:calc(var(--n) * 460px)}
.ph{position:relative;isolation:isolate;padding:0;border:0;background:none;font:inherit;color:inherit;cursor:zoom-in;min-width:0;text-align:left}
.ph .fr{position:absolute;inset:0;overflow:hidden;border-radius:4px;background:var(--gold-soft);box-shadow:0 1px 2px rgba(11,31,58,.08),0 10px 24px rgba(11,31,58,.10)}
.ph .fr img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s cubic-bezier(.2,.7,.2,1),filter .5s}
.ph .fr::after{content:"";position:absolute;inset:8px;border:1px solid rgba(235,208,143,0);border-radius:2px;transition:border-color .4s,inset .4s;pointer-events:none}
.ph:hover .fr img{transform:scale(1.07)}
.ph:hover .fr::after{border-color:rgba(235,208,143,.85);inset:12px}
.ph.big::before,.ph.tall::before{content:"";position:absolute;inset:0;transform:translate(10px,10px);border:1px solid var(--gold-2);border-radius:4px;z-index:-1;transition:transform .5s}
.ph.big:hover::before,.ph.tall:hover::before{transform:translate(14px,14px)}
.ph.big{grid-column:span 2;grid-row:span 2}
.ph.wide{grid-column:span 2}
.ph.tall{grid-row:span 2}
.ph .cap{position:absolute;inset:auto 0 0;padding:34px 14px 12px;font-size:13px;line-height:1.45;color:#fff;background:linear-gradient(transparent,rgba(7,20,40,.88));border-radius:0 0 4px 4px;transform:translateY(4px);opacity:.92;transition:transform .4s,opacity .4s}
.ph:hover .cap{transform:none;opacity:1}
.ph.big .cap{font-size:15px;padding:48px 20px 16px;font-family:var(--f-display)}
.ph .zoom{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(7,20,40,.55);color:#EBD08F;font-size:15px;opacity:0;transform:scale(.8);transition:opacity .3s,transform .3s;backdrop-filter:blur(4px)}
.ph:hover .zoom{opacity:1;transform:none}
@media (max-width:900px){.mosaic{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:170px}}
@media (max-width:560px){.mosaic,.mosaic.few{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:140px;gap:12px}.mosaic.few{grid-auto-rows:200px}.ph.big::before,.ph.tall::before{transform:translate(6px,6px)}}

/* Banner collage: three layered photos with parallax */
.collage{position:relative;height:330px}
.collage figure{position:absolute;margin:0;overflow:hidden;border-radius:4px;border:4px solid #F6F2E6;box-shadow:0 18px 40px rgba(0,0,0,.45);background:#13294A;will-change:transform}
.collage img{width:100%;height:100%;object-fit:cover;display:block}
.collage .c1{inset:6% 6% 14% 14%;transform:rotate(-1.5deg);z-index:1}
.collage .c1::after{content:"";position:absolute;inset:6px;border:1px solid rgba(235,208,143,.7);pointer-events:none}
.collage .c2{left:0;bottom:0;width:44%;height:44%;transform:rotate(-6deg);z-index:2}
.collage .c3{right:0;top:0;width:38%;height:40%;transform:rotate(5deg);z-index:2}
.collage .ring{position:absolute;right:8%;bottom:4%;width:90px;height:90px;border-radius:50%;border:1px solid rgba(212,178,106,.6);z-index:0}
@media (max-width:860px){.collage{height:240px;max-width:420px}}

/* Hero floating certificates */
.portrait .float{position:absolute;margin:0;width:44%;aspect-ratio:4/3;background:#FBF7EC;border:3px solid #F6F2E6;border-radius:4px;box-shadow:0 18px 36px rgba(0,0,0,.45);overflow:hidden;z-index:3;cursor:zoom-in;padding:0}
.portrait .float img{width:100%;height:100%;object-fit:contain;display:block;padding:4px}
.portrait .f1{left:-26%;bottom:16%;transform:rotate(-8deg)}
.portrait .f2{right:-22%;top:10%;transform:rotate(6deg);width:38%}
.portrait .float:hover{z-index:4;box-shadow:0 0 0 2px var(--gold-2),0 22px 44px rgba(0,0,0,.5)}
@media (max-width:860px){.portrait .f1{left:-30%}.portrait .f2{right:-28%}}

/* Photo strip marquee */
.strip{position:relative;overflow:hidden;padding-block:26px 40px;margin-top:64px;background:var(--navy);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.strip-head{text-align:center;color:var(--on-navy);padding-bottom:18px}
.strip-head .kicker{font-size:12.5px;letter-spacing:.16em;color:var(--gold-2);font-weight:600}
.strip-head h2{font-size:clamp(22px,2.6vw,30px);font-weight:600;margin-top:4px}

/* ---------- gallery registry for lightbox ---------- */
let GAL = [];
function reg(list){ const start = GAL.length; GAL.push(...list); return start; }
function ph(item, i, size=''){
  const cap = item.c ? `<span class="cap">${esc(item.c)}</span>` : '';
  return `<button class="ph ${size}" data-i="${i}" aria-label="ขยายภาพ ${esc(item.c||'หลักฐาน')}"><span class="fr"><img src="${img(item.id)}" alt="${esc(item.c||'ภาพหลักฐาน')}" loading="lazy" decoding="async"></span>${cap}<span class="zoom" aria-hidden="true">⤢</span></button>`;
}
/* rhythm of tile sizes; dense grid packs them without holes */
const PAT = ['big','sm','tall','sm','sm','wide','sm','sm','tall','wide','sm','sm','big','sm','sm','wide','tall','sm','sm','sm'];
function mosaic(items, start){
  const n = items.length;
  if (n <= 3) return `<div class="mosaic few" style="--n:${n}">${items.map((it,i)=>ph(it,start+i)).join('')}</div>`;
  const sizes = items.map((_,i)=>PAT[i%PAT.length]);
  if (n < 8) { sizes.fill('sm'); sizes[0]='big'; if(n>=6) sizes[n-1]='wide'; if(n===5) sizes[n-1]='wide'; }
  return `<div class="mosaic">${items.map((it,i)=>ph(it,start+i,sizes[i])).join('')}</div>`;
}
const usable = items => items.filter(([id])=>HAVE.has(id)).map(([id,c])=>({id,c}));

      <div class="filters" role="group" aria-label="กรองประเภท">${kinds.map((k,i)=>`<button class="chip" data-k="${k}" aria-pressed="${i===0}">${k}<span class="c">${i?DEV.filter(d=>d.k===k).length:DEV.length}</span></button>`).join('')}</div>
      <div class="mosaic" id="devGrid">${DEV.map((d,i)=>{
        const size = i===0?'big': d.k==='วิทยากร'?'wide': d.k==='กรรมการ'?'tall': (i===8||i===15)?'wide':'sm';
        return `<button class="ph dv ${size}" data-i="${devStart+i}" data-k="${d.k}" aria-label="ขยายภาพ ${esc(d.t)}">
          <span class="fr"><img src="${img(d.id)}" alt="${esc(d.t)}" loading="lazy"></span><span class="tag">${d.k}</span>
          <span class="ov"><b>${esc(d.t)}</b><small>${d.d}</small></span></button>`;}).join('')}</div>
    </section>

    <section class="sec">
      <div class="sec-head"><div><div class="kicker">ข้อตกลงในการพัฒนางาน</div><h2>ประเด็นท้าทาย ปีงบประมาณ 2569</h2></div><p>ประเด็นที่มุ่งพัฒนาคุณภาพผู้เรียน ครู และสถานศึกษา ตามรายงานผลการปฏิบัติงาน (PA)</p></div>
      <div class="issues">${ISSUES.map((s,i)=>`<article class="issue"><div class="no">${TH(i+1)}</div><h3>${esc(s.t)}</h3><ul>${s.li.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></article>`).join('')}</div>
    </section>

    <section class="sec">
      <div class="profile">
        <div class="card"><h3>ข้อมูลผู้รับการประเมิน</h3><dl class="kv">
          <dt>ชื่อ</dt><dd>นางสาวราตรี พิมพ์ศักดิ์</dd>
          <dt>ตำแหน่ง</dt><dd>รองผู้อำนวยการสถานศึกษา</dd>
          <dt>วิทยฐานะ</dt><dd>รองผู้อำนวยการชำนาญการพิเศษ (คศ. 3)</dd>
          <dt>สถานศึกษา</dt><dd>โรงเรียนบ้านทุ่งใหญ่ ระดับปฐมวัยและประถมศึกษา</dd>
          <dt>บริบท</dt><dd>นักเรียน 151 คน · ครูและบุคลากร 14 คน</dd>
          <dt>สังกัด</dt><dd>สพป.อุดรธานี เขต 3</dd></dl></div>
        <div class="card"><h3>หลักฐานตามมาตรฐานตำแหน่ง</h3><ul class="domains">${TABS.filter(t=>t.n).map(t=>`<li><a href="#${t.key}"><b>${TH(t.n)}</b><span>${t.title}</span><small>${tally(t.key)} ภาพ</small></a></li>`).join('')}</ul></div>
      </div>
    </section>
  </div>`;
}

function viewTab(t){
  const secs = DATA.sections.filter(s=>s.tab===t.key);
  const total = secs.reduce((a,s)=>a+usable(s.items).length,0);
  const big = t.n ? TH(t.n) : 'PA';
  let body = secs.map(s=>{
    const items = usable(s.items);
    const start = reg(items);
    const docs = (s.docs||[]).map(([id,name])=>`<a class="doc" href="${fileUrl(id)}" target="_blank" rel="noopener"><span class="ico">DOCX</span><span>${esc(name)}<small>เปิดใน Google Drive</small></span></a>`).join('');
    const content = items.length ? mosaic(items, start)
      : (docs ? '' : `<div class="empty">ยังไม่มีไฟล์ในโฟลเดอร์นี้ · เปิดโฟลเดอร์ใน Google Drive เพื่อดูเอกสารล่าสุด</div>`);
    const id = 'i-'+s.code.replace(/\W/g,'');
    const lbl = t.n ? `ตัวชี้วัดที่ ${esc(s.code)}` : esc(s.code==='2570'?'ปีงบประมาณ 2570':s.code);
    return `<section class="ind" id="${id}">
      <div class="ind-head" data-code="${esc(s.code)}"><div class="code">${esc(s.code)}</div><div><div class="lbl">${lbl}</div><h2>${esc(s.title)}</h2><div class="count">${items.length ? items.length+' ภาพหลักฐาน' : (s.docs? s.docs.length+' เอกสาร':'รอเพิ่มเอกสาร')}</div></div>
      <a class="btn" href="${folderUrl(s.folder)}" target="_blank" rel="noopener">โฟลเดอร์ต้นฉบับ ${EXT}</a></div>
      <div class="ind-body">${docs?`<div class="docs">${docs}</div>`:''}${content}</div></section>`;
  }).join('');
  if (t.key==='pa') body += `<section class="ind"><div class="ind-head" data-code="2569"><div class="code">69</div><div><div class="lbl">ปีงบประมาณ 2569</div><h2>ประเด็นท้าทาย (สรุปจากรายงาน PA)</h2></div></div>
    <div class="ind-body"><div class="issues">${ISSUES.map((s,i)=>`<article class="issue"><div class="no">${TH(i+1)}</div><h3>${esc(s.t)}</h3><ul>${s.li.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></article>`).join('')}</div></div></section>`;
  const pics = secs.flatMap(s=>usable(s.items).filter(x=>!/สรุปผลงาน|ผลงาน \d|คำสั่ง|QR|ปก/.test(x.c))).slice(0,12);
  const pick = [pics[0], pics[Math.floor(pics.length/2)], pics[pics.length-1]].filter(Boolean);
  const collage = pick.length===3 ? `<div class="collage" aria-hidden="true"><span class="ring" data-depth="-.04"></span>
      <figure class="c1" data-depth=".03"><img src="${img(pick[0].id)}" alt=""></figure>
      <figure class="c2" data-depth=".09" data-rot="-6"><img src="${img(pick[1].id)}" alt=""></figure>
      <figure class="c3" data-depth="-.07" data-rot="5"><img src="${img(pick[2].id)}" alt=""></figure></div>` : '';
  return `<section class="banner"><div class="wrap"><div class="big" aria-hidden="true">${big}</div><div>
      <div class="eyebrow">${t.n?'มาตรฐานตำแหน่ง ด้านที่ '+t.n:'Performance Agreement'}</div>
      <h1 style="margin-top:10px">${t.title}</h1><p>${t.sub}</p>
      <div class="meta"><span><b>${secs.length}</b>${t.n?'ตัวชี้วัด':'หมวดเอกสาร'}</span><span><b>${total}</b>ภาพหลักฐาน</span><a href="${folderUrl(t.folder)}" target="_blank" rel="noopener">เปิดโฟลเดอร์ใน Google Drive ↗</a></div>
    </div>${collage}</div></section>
    <div class="wrap"><nav class="toc" aria-label="ตัวชี้วัด">${secs.map(s=>`<a href="#${t.key}" data-jump="i-${s.code.replace(/\W/g,'')}"><b>${esc(s.code)}</b>${esc(s.title.length>34?s.title.slice(0,34)+'…':s.title)}</a>`).join('')}</nav>${body}</div>`;
}

/* ---------- router ---------- */
const app = document.getElementById('app');
const tabsEl = document.getElementById('tabs');
tabsEl.innerHTML = TABS.map(t=>`<a href="#${t.key}" data-k="${t.key}">${t.n?`<span class="n">${TH(t.n)}</span>`:''}${t.n?'ด้าน'+t.label:t.label}</a>`).join('');
function render(){
  const key = (location.hash||'#home').slice(1);
  const t = TABS.find(x=>x.key===key) || TABS[0];
  GAL = [];
  app.innerHTML = `<main class="view">${t.key==='home'?viewHome():viewTab(t)}</main>`;
  tabsEl.querySelectorAll('a').forEach(a=>{ if(a.dataset.k===t.key){a.setAttribute('aria-current','page');a.scrollIntoView({block:'nearest',inline:'center'})} else a.removeAttribute('aria-current'); });
  window.scrollTo({top:0});
}
window.addEventListener('hashchange', render);
render();

/* ---------- interactions ---------- */
app.addEventListener('click', e=>{
  const j = e.target.closest('[data-jump]');
  if (j){ e.preventDefault(); document.getElementById(j.dataset.jump)?.scrollIntoView({behavior:'smooth'}); return; }
  const chip = e.target.closest('.chip');
  if (chip){ const k = chip.dataset.k;
    app.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed', c===chip));
    app.querySelectorAll('#devGrid .devc').forEach(c=>c.hidden = !(k==='ทั้งหมด'||c.dataset.k===k)); return; }
  const b = e.target.closest('[data-i]');
  if (b) openLB(+b.dataset.i);
});

const lb = document.getElementById('lb'), lbImg = document.getElementById('lbImg');
let cur = 0, lastFocus = null;
function visibleIdx(){ return [...new Set([...app.querySelectorAll('[data-i]')].filter(el=>!el.hidden && el.offsetParent!==null).map(el=>+el.dataset.i))].sort((a,b)=>a-b); }
/* gentle parallax on banner collage layers */
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
let ticking = false;
addEventListener('scroll', ()=>{ if (calm || ticking) return; ticking = true; requestAnimationFrame(()=>{ const y = scrollY;
  app.querySelectorAll('[data-depth]').forEach(el=>{ const d = +el.dataset.depth, r = el.dataset.rot||(el.classList.contains('c1')?-1.5:0); el.style.transform = `translateY(${(y*d).toFixed(1)}px) rotate(${r}deg)`; });
  ticking = false; }); }, {passive:true});
function openLB(i){ lastFocus = document.activeElement; cur = i; lb.hidden = false; show(); document.getElementById('lbClose').focus(); document.body.style.overflow='hidden'; }
function show(){ const it = GAL[cur]; const vis = visibleIdx(); lbImg.src = img(it.id); lbImg.alt = it.c||'ภาพหลักฐาน';
  document.getElementById('lbCap').textContent = it.c||'ภาพหลักฐาน';
  document.getElementById('lbLink').href = fileUrl(it.id);
  document.getElementById('lbCount').textContent = `${vis.indexOf(cur)+1} / ${vis.length}`; }
function step(d){ const vis = visibleIdx(); const p = vis.indexOf(cur); cur = vis[(p+d+vis.length)%vis.length]; show(); }
function closeLB(){ lb.hidden = true; document.body.style.overflow=''; lastFocus?.focus(); }
document.getElementById('lbClose').onclick = closeLB;
document.getElementById('lbPrev').onclick = ()=>step(-1);
document.getElementById('lbNext').onclick = ()=>step(1);
lb.addEventListener('click', e=>{ if(e.target===lb || e.target.classList.contains('lb-fig')) closeLB(); });
document.addEventListener('keydown', e=>{ if(lb.hidden) return; if(e.key==='Escape') closeLB(); if(e.key==='ArrowLeft') step(-1); if(e.key==='ArrowRight') step(1); });
let tx=null; lb.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
lb.addEventListener('touchend',e=>{ if(tx==null) return; const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>50) step(dx<0?1:-1); tx=null; });
</script>
